services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pharmatrust
      POSTGRES_USER: pharmatrust
      POSTGRES_PASSWORD: pharmatrust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmatrust -d pharmatrust"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
    env_file: ${ENV_FILE:-.env.example}
    environment:
      DATABASE_URL: postgresql+psycopg://pharmatrust:pharmatrust@postgres:5432/pharmatrust
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
    volumes:
      - app_storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ./apps/api
    command: celery -A app.tasks.celery_app:celery worker --loglevel=INFO
    env_file: ${ENV_FILE:-.env.example}
    environment:
      DATABASE_URL: postgresql+psycopg://pharmatrust:pharmatrust@postgres:5432/pharmatrust
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
    volumes:
      - app_storage:/app/storage
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ./apps/api
    command: celery -A app.tasks.celery_app:celery beat --loglevel=INFO
    env_file: ${ENV_FILE:-.env.example}
    environment:
      DATABASE_URL: postgresql+psycopg://pharmatrust:pharmatrust@postgres:5432/pharmatrust
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  app_storage:
